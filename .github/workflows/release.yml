name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      target_sha: ${{ steps.version.outputs.target_sha }}

    steps:
      - name: Show trigger context
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Install GitVersion
        shell: bash
        run: |
          dotnet tool install --global GitVersion.Tool --version "6.0.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if dotnet-gitversion /output json /config GitVersion.yml > gitversion.json; then
            cat gitversion.json
            version="$(jq -r '.SemVer // empty' gitversion.json)"
          else
            echo "GitVersion failed. Falling back to GitHub run number version." >&2
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "GitVersion did not produce SemVer. Falling back to GitHub run number version." >&2
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          tag_name="v${version}"
          release_name="Turris ${version}"
          target_sha="$(git rev-parse HEAD)"

          version_core="${version%%-*}"
          IFS='.' read -r major minor patch extra <<< "${version_core}"
          major="${major:-1}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          if [ "${major}" -lt 1 ]; then
            major=1
          fi
          app_version="${major}.${minor}.${patch}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

          echo "version=${version}"
          echo "app_version=${app_version}"
          echo "tag_name=${tag_name}"
          echo "target_sha=${target_sha}"

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.version.outputs.tag_name }}"
          target_sha="${{ steps.version.outputs.target_sha }}"

          echo "Creating release tag ${tag_name} for ${target_sha}"
          git remote -v

          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists; leaving it unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag_name}" "${target_sha}" -m "Release ${tag_name}"
            git push origin "refs/tags/${tag_name}"
            echo "Pushed tag ${tag_name}"
          fi

          git ls-remote --tags origin "refs/tags/${tag_name}"

  build-release-assets:
    name: Build jar bundle ${{ matrix.asset_name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: Turris-windows-x64
            maven_profile: windows-x64
            jar_classifier: natives-windows

          - asset_name: Turris-windows-x86
            maven_profile: windows-x86
            jar_classifier: natives-windows-x86

          - asset_name: Turris-macos-arm64
            maven_profile: macos-arm64
            jar_classifier: natives-macos-arm64

          - asset_name: Turris-macos-x64
            maven_profile: macos-x64
            jar_classifier: natives-macos

          - asset_name: Turris-linux-x64
            maven_profile: linux-x64
            jar_classifier: natives-linux

          - asset_name: Turris-linux-arm32
            maven_profile: linux-arm32
            jar_classifier: natives-linux-arm32

          - asset_name: Turris-linux-arm64
            maven_profile: linux-arm64
            jar_classifier: natives-linux-arm64

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven project version
        shell: bash
        run: |
          mvn -B versions:set \
            -DnewVersion="${{ needs.prepare-release.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build platform jar
        shell: bash
        run: |
          mvn -B -P "${{ matrix.maven_profile }}" package

      - name: Package platform release zip
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare-release.outputs.version }}"
          asset_name="${{ matrix.asset_name }}-${version}"
          jar_name="turris-${version}-${{ matrix.jar_classifier }}.jar"
          dist_dir="dist/${asset_name}"

          test -f "target/${jar_name}"
          test -d target/assets

          mkdir -p "${dist_dir}"
          cp "target/${jar_name}" "${dist_dir}/"
          cp -R target/assets "${dist_dir}/assets"
          cp README.md "${dist_dir}/README.md"

          (cd dist && zip -qr "../${asset_name}.zip" "${asset_name}")
          ls -lh "${asset_name}.zip"

      - name: Upload packaged asset artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}-${{ needs.prepare-release.outputs.version }}.zip
          if-no-files-found: error

  build-native-packages:
    name: Build native launcher ${{ matrix.asset_name }}
    needs:
      - prepare-release
      - publish-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: Turris-windows-x64-exe
            os: windows-latest
            maven_profile: windows-x64
            jar_classifier: natives-windows
            archive_ext: zip

          - asset_name: Turris-macos-arm64-dmg
            os: macos-14
            expected_arch: arm64
            maven_profile: macos-arm64
            jar_classifier: natives-macos-arm64
            archive_ext: dmg

          - asset_name: Turris-macos-x64-dmg
            os: macos-15-intel
            expected_arch: x86_64
            maven_profile: macos-x64
            jar_classifier: natives-macos
            archive_ext: dmg

          - asset_name: Turris-linux-x64-executable
            os: ubuntu-latest
            maven_profile: linux-x64
            jar_classifier: natives-linux
            archive_ext: tar.gz

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.expected_arch }}"
          echo "actual_arch=${actual_arch}"
          echo "expected_arch=${expected_arch}"
          test "${actual_arch}" = "${expected_arch}"

      - name: Set Maven project version
        shell: bash
        run: |
          mvn -B versions:set \
            -DnewVersion="${{ needs.prepare-release.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build platform jar
        shell: bash
        run: |
          mvn -B -P "${{ matrix.maven_profile }}" package

      - name: Prepare jpackage input
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          jar_name="turris-${version}-${{ matrix.jar_classifier }}.jar"

          test -f "target/${jar_name}"
          test -d target/assets

          mkdir -p jpackage-input
          cp "target/${jar_name}" "jpackage-input/${jar_name}"
          cp -R target/assets jpackage-input/assets

      - name: Build Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-release.outputs.version }}"
          $appVersion = "${{ needs.prepare-release.outputs.app_version }}"
          $jar = "turris-$version-${{ matrix.jar_classifier }}.jar"
          jpackage --type app-image --name Turris --app-version "$appVersion" --input jpackage-input --main-jar "$jar" --dest native --vendor OleeL
          Compress-Archive -Path native/Turris/* -DestinationPath "${{ matrix.asset_name }}-$version.zip" -Force

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          app_version="${{ needs.prepare-release.outputs.app_version }}"
          jar="turris-${version}-${{ matrix.jar_classifier }}.jar"
          jpackage --type dmg --name Turris --app-version "${app_version}" --input jpackage-input --main-jar "${jar}" --dest native --vendor OleeL
          dmg="$(find native -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -f "${dmg}"
          cp "${dmg}" "${{ matrix.asset_name }}-${version}.dmg"

      - name: Build Linux app image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          app_version="${{ needs.prepare-release.outputs.app_version }}"
          jar="turris-${version}-${{ matrix.jar_classifier }}.jar"
          jpackage --type app-image --name Turris --app-version "${app_version}" --input jpackage-input --main-jar "${jar}" --dest native --vendor OleeL
          tar -czf "${{ matrix.asset_name }}-${version}.tar.gz" -C native Turris

      - name: Upload native package artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}-${{ needs.prepare-release.outputs.version }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload native package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset_name }}-${{ needs.prepare-release.outputs.version }}.${{ matrix.archive_ext }}"
          gh release upload "${{ needs.prepare-release.outputs.tag_name }}" "${asset}" --repo "${GITHUB_REPOSITORY}" --clobber

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare-release
      - build-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download jar bundle artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Turris-*
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -print -exec ls -lh {} \;
          jar_bundle_count="$(find release-assets -maxdepth 1 -name 'Turris-*.zip' ! -name '*-exe-*' | wc -l)"
          total_asset_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          echo "jar_bundle_count=${jar_bundle_count}"
          echo "total_asset_count=${total_asset_count}"
          test "${jar_bundle_count}" -ge 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          target_commitish: ${{ needs.prepare-release.outputs.target_sha }}
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ needs.prepare-release.outputs.tag_name }}"
          gh release view "${tag_name}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,assets --jq '.tagName + " " + .name, (.assets[] | .name)'
          asset_count="$(gh release view "${tag_name}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          test "${asset_count}" -ge 7
